name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, test, security)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Unit tests (no cloud credentials needed)
        run: pytest --cov=app --cov-report=term-missing

      - name: Static security analysis (bandit)
        run: bandit -q -r app -ll

      - name: Dependency vulnerability audit (pip-audit)
        # Advisory: new CVEs appear independently of code changes, so do not block merges.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [aws, azure]
    defaults:
      run:
        working-directory: terraform/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh

  docker:
    name: Docker build and config validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate Prometheus config and alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Build API image
        run: docker build -t cloudops360:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 cloudops360:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/cloud/aws
          curl -fsS http://127.0.0.1:8000/metrics | grep -q cloudops_cpu_percent
          docker rm -f smoke

      - name: Trivy image scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudops360:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy IaC scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: "0"
