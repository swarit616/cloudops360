
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cloudops360

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cloudops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudops-api:8000"]
        labels:
          source: local

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          source: local
